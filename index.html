<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>API Test (CORS Access)</h1>
    <h4><a href="https://technicalmastersp.github.io/CODSOFT-INT/level-01/Task-02/index.html" style="text-decoration: none; color: orange;">Technical Master SP</a></h4>

    <div class="urlSection">
        <div class="methodContainer">
            <label for="method">Method</label>
            <select id="method">
                <option selected>GET</option>
                <option>POST</option>
                <option>PUT</option>
                <option>PATCH</option>
                <option>DELETE</option>
            </select>
        </div>

        <div class="urlContainer">
            <label for="url">API URL</label>
            <input
                type="text"
                id="url"
                placeholder="https://api.example.com/users"
            >
        </div>
    </div>

    <h3>Headers</h3>

    <div id="headers"></div>

    <button id="addHeader">
        + Add Header
    </button>

    <h3>Request Body (JSON)</h3>

    <textarea
        id="body"
        placeholder='{
    "name":"John"
}'
    ></textarea>

    <button id="send">
        Send Request
    </button>

    <div class="result">

        <div class="durationAndStatusSection">
            <div class="statusContainer">
                <h3>Status</h3>
                <pre id="status"></pre>
            </div>

            <div class="durationContainer">
                <h3>Duration</h3>
                <pre id="time"></pre>
            </div>
        </div>

        <h3>Response Headers</h3>
        <pre id="responseHeaders"></pre>

        <h3>Response</h3>
        <pre id="response"></pre>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
